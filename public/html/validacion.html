<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Validación de Inscriptos — Expo Formación</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/validacion.css" />
    <link rel="icon" href="../img/logo_expo.png" />
  </head>

  <body>
    <!-- Header con contador -->
    <div class="hero-section">
      <img src="../img/logo-expo-formacion.png" alt="Logo Expo Formación" class="hero-logo" />
      <p class="hero-subtitle">Sector Construcción · 2026</p>
      <h1 class="hero-title">Panel de Validación</h1>
      <p class="contador-validados">Validados hoy: <span id="contador-validados">—</span></p>
    </div>

    <div class="validacion-container">
      <!-- input principal -->
      <div class="busqueda-card input-principal-card">
        <div class="input-group">
          <i class="fas fa-id-card input-icon"></i>
          <input
            type="text"
            id="dni-input"
            placeholder="DNI o escanear QR"
            autocomplete="off"
            inputmode="numeric"
            autofocus
          />
        </div>
        <button id="btn-validar" class="btn-validar-principal">
          <i class="fas fa-check"></i> VALIDAR
        </button>
      </div>

      <!-- Estado de carga -->
      <div id="loading" class="loading" hidden>
        <div class="spinner"></div>
      </div>

      <!-- Área de resultado: ÉXITO -->
      <div id="resultado-exito" class="resultado-card resultado-exito" hidden>
        <i class="fas fa-check-circle resultado-icon"></i>
        <h2 id="nombre-resultado" class="nombre-resultado"></h2>
        <div id="charlas-resultado" class="charlas-resultado"></div>
        <div id="ya-validado-msg" class="ya-validado-msg" hidden>
          <i class="fas fa-exclamation-triangle"></i> Ya validado previamente
        </div>
      </div>

      <!-- Área de resultado: ERROR -->
      <div id="resultado-error" class="resultado-card resultado-error" hidden>
        <i class="fas fa-times-circle resultado-icon"></i>
        <p class="error-mensaje">DNI no encontrado</p>
      </div>

      <!-- Error de servidor -->
      <div id="error-servidor" class="resultado-card resultado-error" hidden>
        <i class="fas fa-exclamation-triangle resultado-icon"></i>
        <p id="error-mensaje">Error de conexión</p>
      </div>
    </div>

    <div class="footer-info">
      <p>Expo Formación UOCRA &copy; 2026 &nbsp;·&nbsp; <a href="/">Volver al inicio</a> &nbsp;·&nbsp; <a href="/estadisticas">Estadísticas</a></p>
    </div>

    <script src="../js/validacion.js"></script>
  </body>
</html>
