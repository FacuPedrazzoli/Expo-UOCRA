<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow">
    <title>Validación — Expo Formación</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/validacion.css" />
    <link rel="icon" href="../img/logo_expo.png" />
  </head>

  <body>

    <!-- HERO -->
    <div class="hero-section">
      <img src="../img/logo-expo-formacion.png" alt="Logo Expo Formación" class="hero-logo" />
      <div class="hero-linea-deco"></div>
      <p class="hero-subtitle">SECTOR CONSTRUCCIÓN · 2026</p>
      <h1 class="hero-title">Panel de Validación</h1>
      <div class="contador-badge">
        <span class="contador-numero" id="contador-validados">—</span>
        <span class="contador-label">Validados</span>
      </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="validacion-container">

      <!-- INPUT CARD -->
      <div class="busqueda-card glass-card">
        <div class="input-group">
          <i class="fas fa-id-card input-icon"></i>
          <input
            type="text"
            id="dni-input"
            placeholder="Ingresá el DNI"
            autocomplete="off"
            inputmode="numeric"
            autofocus
          />
        </div>
        <button id="btn-validar" class="btn-validar-principal">
          <i class="fas fa-check"></i> Validar
        </button>
      </div>

      <!-- LOADING -->
      <div id="loading" class="loading" hidden>
        <div class="spinner"></div>
      </div>

      <!-- ÉXITO -->
      <div id="resultado-exito" class="resultado-card resultado-exito glass-card" hidden>
        <i class="fas fa-check-circle resultado-icon"></i>
        <h2 id="nombre-resultado" class="nombre-resultado"></h2>
        <div id="charlas-resultado" class="charlas-resultado"></div>
        <div id="ya-validado-msg" class="ya-validado-msg" hidden>
          <i class="fas fa-clock"></i>
          Validado anteriormente
        </div>
      </div>

      <!-- ERROR NO ENCONTRADO -->
      <div id="resultado-error" class="resultado-card resultado-error glass-card" hidden>
        <i class="fas fa-times-circle resultado-icon"></i>
        <p class="error-mensaje">DNI no encontrado</p>
      </div>

      <!-- ERROR SERVIDOR -->
      <div id="error-servidor" class="resultado-card resultado-error glass-card" hidden>
        <i class="fas fa-wifi resultado-icon"></i>
        <p id="error-mensaje" class="error-mensaje">Error de conexión</p>
      </div>

    </div>

    <!-- FOOTER -->
    <div class="footer-info">
      <p>Expo Formación UOCRA &copy; 2026 · <a href="/">Inicio</a> · <a href="/estadisticas">Estadísticas</a></p>
    </div>

    <script src="../js/validacion.js"></script>
  </body>
</html>
