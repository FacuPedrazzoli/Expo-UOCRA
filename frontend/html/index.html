<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expo UOCRA</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" href="../images/UOCRA-logo.jpg" type="image/x-icon">
</head>
<body>
    <div class="container">
        <div class="title">Registration Form</div>
        <form action="#">
            <div class="form-content">
                <div class="input-box">
                    <label for="fullName">Nombre</label>
                    <input type="text" id="nombre" placeholder="Nombre" required>
                </div>
                <div class="input-box">
                    <label for="email">Apellido</label>
                    <input type="email" id="apellido" placeholder="Apellido" required>
                </div>
                <div class="input-box">
                    <label for="phone">DNI</label>
                    <input type="text" id="phone" placeholder="DNI 12.345.67" required>
                </div>
                <div class="input-box">
                    <label for="password">Email</label>
                    <input type="password" id="password" placeholder="email@gmail.com" required>
                </div>
                <div class="input-box">
                    <label for="charlas">Charlas</label>
                    <select id="charlas" required>
                        <option value="" disabled selected>Selecciona una charla</option>
                        <option value="charlas1">Sinteplas</option>
                        <option value="charlas2">Energias renovables</option>
                        <option value="charlas3">Cerraduras electronicas</option>
                        <!-- Agrega más opciones según sea necesario -->
                    </select>
                </div>
            </div>
            <div class="button">
                <input type="submit" value="Registrarse">
            </div>
        </form>
    </div>
</body>
</html>
